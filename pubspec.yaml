name: kanji_app
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0-295.0.dev
  flutter: ^3.43.0-1.0.pre-340

dependencies:
  cached_query_flutter: ^3.3.6
  cached_storage: ^3.2.6
  collection: ^1.19.1
  dio: ^5.9.2
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_adaptive_scaffold: ^0.3.3+1
  flutter_localizations:
    sdk: flutter
  flutter_staggered_grid_view: ^0.7.0
  gap: ^3.0.1
  go_router: ^17.1.0
  kana_kit: ^2.1.1
  leancode_hooks: ^0.1.2+1
  logging: ^1.3.0
  material_shapes:
    git: https://github.com/ksokolovskyi/material_shapes
  meta: ^1.18.0
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.5+1
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  svg_path_parser: ^1.1.2
  url_launcher: ^6.3.2
  xml: ^6.6.1

dev_dependencies:
  arb_utils: ^0.10.1
  build_runner: ^2.13.1
  characters: ^1.4.1
  code_builder: ^4.11.1
  excel:
    git: https://github.com/justkawal/excel
  file: ^7.0.1
  go_router_builder: ^4.2.1
  leancode_lint: ^22.0.0

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true
  generate: true

  assets:
    - assets/kanji.jsonl
    - assets/radicals.jsonl

  fonts:
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: Yu Kyokasho
      fonts:
        - asset: assets/fonts/Kyokasho.ttf
