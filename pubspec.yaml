name: kanji_app
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.15.0-178.0.dev
  flutter: ^3.51.0-1.0.pre-375

dependencies:
  cached_query_flutter: ^3.4.1
  cached_storage: ^3.3.1
  collection: ^1.19.1
  cupertino_ui: ^1.1.7
  dio: ^5.11.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gap: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  kana_kit: ^2.1.1
  leancode_hooks: ^0.1.2+1
  liquid_glass_renderer: ^1.0.0-dev.2
  logging: ^1.3.0
  material_ui: ^1.11.1
  meta: ^1.19.0
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.5+1
  sqflite_common_ffi: ^2.4.7
  sqflite_common_ffi_web: ^1.2.2
  svg_path_parser: ^1.1.2
  url_launcher: ^6.3.3
  xml: ^6.6.1

dev_dependencies:
  arb_utils: ^0.11.1
  build_runner: ^2.17.1
  characters: ^1.4.1
  code_builder: ^4.13.0
  excel:
    git: https://github.com/justkawal/excel
  file: ^7.0.1
  go_router_builder: ^4.5.3
  leancode_lint: ^28.0.0

dependency_overrides:
  liquid_glass_renderer: ^1.0.0-dev.2

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true
  generate: true

  assets:
    - assets/kanji.jsonl
    - assets/radicals.jsonl

  fonts:
    - family: Material Symbols Rounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/RobotoFlex.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: Yu Kyokasho
      fonts:
        - asset: assets/fonts/Kyokasho.ttf
